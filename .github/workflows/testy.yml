name: CI – Asystent Regulaminowy PWr

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test_and_lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Konfiguracja Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache zależności pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('v2/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r v2/requirements.txt

      - name: Linter – ruff (PEP8 + błędy składni)
        run: ruff check v2/

      - name: Formatter – ruff (Sprawdzenie formatowania)
        run: ruff format --check v2/

      - name: Bezpieczeństwo – bandit (Skanowanie luk)
        run: bandit -r v2/ -x v2/tests/

      - name: Typowanie – mypy (Statyczna analiza typów)
        run: mypy v2/ --ignore-missing-imports

      - name: Testy regresji i Accuracy Gate (test_diff.py)
        run: |
          cd v2
          python tests/test_diff.py --compare --min-accuracy 0.65

      - name: Test Integracyjny – Smoke Test (Flask)
        run: |
          python v2/tests/smoke_test.py
