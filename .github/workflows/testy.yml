name: CI – Asystent Regulaminowy PWr

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test_and_lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: "utf-8"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Konfiguracja Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache zależności pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Linter – ruff (PEP8 + błędy składni)
        run: python -m ruff check .

      - name: Formatter – ruff (Sprawdzenie formatowania)
        run: python -m ruff format --check .

      - name: Bezpieczeństwo – bandit (Skanowanie luk)
        run: python -m bandit -r . -x ./tests/

      - name: Typowanie – mypy (Statyczna analiza typów)
        run: python -m mypy . --ignore-missing-imports

      - name: Testy regresji i Accuracy Gate (test_diff.py)
        run: |
          python tests/test_diff.py --compare --min-accuracy 0.65

      - name: Test Integracyjny – Smoke Test (Flask)
        run: |
          python tests/smoke_test.py
