[terminy]
wzorce = [
    'do\s+(\d+)\s+(stycznia|lutego|marca|kwietnia|maja|czerwca|lipca|sierpnia|września|października|listopada|grudnia)',
    '(\d+)\s+dni\s+robocz\w+',
    '(\d+)\s+dni\s+kalendarzow\w+',
    'w\s+ciągu\s+(\d+)\s+dni',
    'nie\s+później\s+niż\s+(.{5,40}?)[\.,]',
    'do\s+końca\s+(.{5,40}?)[\.,]',
    'najpóźniej\s+do\s+(.{5,40}?)[\.,]',
    'w\s+terminie\s+(.{5,40}?)[\.,]',
    '(trzeciego\s+dnia\s+roboczego\s+.{5,40}?)[\.,]',
    'co\s+najmniej\s+(\w+\s+dniow\w+\s+odstep\w*)',
    'co\s+najmniej\s+(\w+\s+dniowym\s+odstep\w*)',
    'pieciodniowym\s+odstep\w*',
    'pięciodniowym\s+odstep\w*',
    'co\s+najmniej\s+pięciodniowym\s+odstępem',
    'co\s+najmniej\s+pieciodniowym\s+odstepem'
]

