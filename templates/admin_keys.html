<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zarządzanie Kluczami API</title>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0f;
            --surface: #141418;
            --border: #2a2a32;
            --accent: #c8ff00;
            --accent2: #00d4ff;
            --text: #e8e8f0;
            --muted: #606070;
            --danger: #ff4444;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Syne', sans-serif;
            margin: 0;
            padding: 32px;
        }

        h1 {
            font-weight: 800;
            margin-bottom: 24px;
            font-size: 24px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .card h2 {
            font-size: 16px;
            color: var(--muted);
            margin-top: 0;
            margin-bottom: 16px;
            font-family: 'JetBrains Mono', monospace;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
        }

        th,
        td {
            text-align: left;
            padding: 12px 8px;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 10px;
        }

        .btn {
            padding: 8px 16px;
            background: var(--accent);
            border: none;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            font-family: 'Syne', sans-serif;
            font-size: 14px;
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }

        .status-active {
            color: var(--accent);
        }

        .status-revoked {
            color: var(--danger);
        }

        #newKeyResult {
            display: none;
            background: rgba(200, 255, 0, 0.1);
            border: 1px solid var(--accent);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>

<body>

    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>Zarządzanie Kluczami API</h1>
        <div>
            <a href="/admin?token={{ token }}" style="color: var(--muted); text-decoration: none; margin-right: 16px;">Wróć do statystyk</a>
            <input type="text" id="newKeyName" placeholder="Nazwa klucza..." required style="padding: 8px; background: #0d0d0f; border: 1px solid #2a2a32; color: #fff; border-radius: 4px; margin-right: 8px;">
            <button class="btn" onclick="createKey()">+ Generuj Nowy Klucz</button>
        </div>
    </div>

    <div id="newKeyResult">
        <h3 style="margin-top: 0; color: var(--accent);">Klucz wygenerowany pomyślnie!</h3>
        <p>Skopiuj ten klucz teraz, ponieważ nie zostanie wyświetlony ponownie:</p>
        <div style="background: #000; padding: 12px; border-radius: 4px; word-break: break-all; font-size: 16px;" id="rawKeyValue"></div>
    </div>

    <div class="card">
        <h2>Wygenerowane Klucze</h2>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Key ID</th>
                        <th>Nazwa</th>
                        <th>Utworzony</th>
                        <th>Status</th>
                        <th>Użycia</th>
                        <th>Ostatnie użycie</th>
                        <th>Akcje</th>
                    </tr>
                </thead>
                <tbody id="keysTableBody">
                    <tr><td colspan="6" style="text-align: center; color: var(--muted);">Ładowanie...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const TOKEN = '{{ token }}';

        async function fetchKeys() {
            try {
                const res = await fetch(`/admin/api-keys?token=${TOKEN}`);
                const keys = await res.json();
                
                const tbody = document.getElementById('keysTableBody');
                tbody.innerHTML = '';

                if (keys.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--muted); padding: 20px;">Brak kluczy w bazie.</td></tr>';
                    return;
                }

                keys.forEach(k => {
                    const statusText = k.revoked ? 'Unieważniony' : 'Aktywny';
                    const statusClass = k.revoked ? 'status-revoked' : 'status-active';
                    
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="color: var(--text);"><strong>${k.key_id}</strong></td>
                        <td style="color: var(--text);">${k.name || '-'}</td>
                        <td>${k.created_at}</td>
                        <td class="${statusClass}">${statusText}</td>
                        <td>${k.usage_count}</td>
                        <td>${k.last_used_at || '-'}</td>
                        <td>
                            ${!k.revoked ? `<button class="btn btn-danger" onclick="revokeKey('${k.key_id}')" style="padding: 4px 8px; font-size: 12px; margin-right: 4px;">Unieważnij</button>` : ''}
                            ${!k.revoked ? `<button class="btn" onclick="renameKey('${k.key_id}', '${k.name || ''}')" style="padding: 4px 8px; font-size: 12px; background: #00d4ff;">✏️ Zmień nazwę</button>` : ''}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error(e);
            }
        }

        async function createKey() {
            const nameInput = document.getElementById('newKeyName');
            const name = nameInput.value.trim();
            if(!name) {
                alert("Proszę wpisać nazwę klucza przed wygenerowaniem.");
                return;
            }
            if(!confirm(`Czy na pewno chcesz wygenerować nowy klucz API o nazwie "${name}"?`)) return;
            
            try {
                const res = await fetch(`/admin/api-keys?token=${TOKEN}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, scopes: ["all"] })
                });
                const data = await res.json();
                
                if (res.ok && data.api_key) {
                    document.getElementById('rawKeyValue').innerText = data.api_key;
                    document.getElementById('newKeyResult').style.display = 'block';
                    nameInput.value = '';
                    fetchKeys();
                } else {
                    alert(data.error || "Błąd podczas generowania klucza.");
                }
            } catch (e) {
                console.error(e);
                alert("Wystąpił błąd.");
            }
        }

        async function revokeKey(keyId) {
            if(!confirm("Czy na pewno chcesz unieważnić ten klucz? Ta operacja zwolni jego nazwę i jest nieodwracalna!")) return;

            try {
                const res = await fetch(`/admin/api-keys/${keyId}/revoke?token=${TOKEN}`, {
                    method: 'POST'
                });
                if (res.ok) {
                    fetchKeys();
                } else {
                    alert("Błąd podczas unieważniania klucza.");
                }
            } catch (e) {
                console.error(e);
                alert("Wystąpił błąd.");
            }
        }

        async function renameKey(keyId, currentName) {
            const newName = prompt("Podaj nową, unikalną nazwę dla tego klucza:", currentName);
            if(newName === null || newName.trim() === "" || newName.trim() === currentName) return;

            try {
                const res = await fetch(`/admin/api-keys/${keyId}/name?token=${TOKEN}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: newName.trim() })
                });
                const data = await res.json();
                
                if (res.ok) {
                    fetchKeys();
                } else {
                    alert(data.error || "Błąd podczas zmiany nazwy klucza.");
                }
            } catch (e) {
                console.error(e);
                alert("Wystąpił błąd.");
            }
        }

        // Inicjalizacja
        fetchKeys();
    </script>
</body>

</html>
